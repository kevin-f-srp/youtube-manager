name: Video studio tests
on:
  pull_request:
    paths: ['src/studio/**', 'tests/test_studio*.py', 'requirements-studio.txt', '.github/workflows/studio.yml']
  push:
    branches: ['1-local-video-studio']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask pillow
      - run: python -m unittest discover -s tests -p test_studio.py -v
      - run: node --check src/studio/static/studio.js
